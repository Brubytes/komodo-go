name: komodo_go
description: "Flutter app to control Komodo infrastructure management platform."
publish_to: 'none'
version: 0.5.3+12

environment:
  sdk: ^3.12.0

dependencies:
  cupertino_icons: ^1.0.9
  dio: ^5.9.1
  flutter:
    sdk: flutter
  flutter_hooks: ^0.21.3
  flutter_riverpod: ^3.3.2
  # Keychain query changes require explicit migration coverage before updates.
  flutter_secure_storage: 10.3.1
  fpdart: ^1.2.0
  freezed_annotation: ^3.1.0
  gap: ^3.0.1
  go_router: ^17.3.0
  hooks_riverpod: ^3.3.2
  json_annotation: ^4.12.0
  lucide_icons_flutter: ^3.1.15
  riverpod: ^3.3.2
  riverpod_annotation: ^4.0.3
  shared_preferences: ^2.5.5
  skeletonizer: ^2.1.2
  syntax_highlight: ^0.5.0
  url_launcher: ^6.3.2
dev_dependencies:
  build_runner: ^2.15.1
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  flutter_test:
    sdk: flutter
  freezed: 3.2.6-dev.1
  image: ^4.9.1
  integration_test:
    sdk: flutter
  json_serializable: ^6.14.1
  mocktail: ^1.0.5
  patrol: ^4.8.0
  riverpod_generator: ^4.0.4
  test_api: ^0.7.11
  very_good_analysis: ^10.3.0

dependency_overrides:
  # Remove once a pub.dev release includes Android 16 KB page-size support.
  # Upstream tracking issue: https://github.com/superlistapp/super_native_extensions/issues/548
  super_native_extensions:
    git:
      url: https://github.com/dilumdesilva/super_native_extensions
      ref: 1d413d5e333058ed90274e44ac703c9d96f4e567
      path: super_native_extensions

patrol:
  test_directory: integration_test

flutter:
  uses-material-design: true
  assets:
    - assets/komodo-go-logo.png
    - assets/komodo-go-logo_rounded.png
    - assets/komodo-go-logo_circle.png
    - assets/demo_mode/ui_defined_stack/compose.yml

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/komodo-go-logo.png
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/komodo-go-logo.png
  web:
    generate: true
    image_path: assets/komodo-go-logo.png
    background_color: "#FFFFFF"
    theme_color: "#FFFFFF"
  windows:
    generate: true
    image_path: assets/komodo-go-logo.png
    icon_size: 256
  macos:
    generate: true
    image_path: assets/komodo-go-logo.png

flutter_native_splash:
  color: "#014226"
  image: assets/komodo-go-logo_rounded.png
  android_gravity: center
  ios_content_mode: center
  android_12:
    color: "#014226"
    image: assets/komodo-go-logo_rounded_android12.png
